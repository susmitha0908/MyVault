version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vaultops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_db_secure_password_replace_me}
      POSTGRES_DB: ${POSTGRES_DB:-vaultops_db}
    ports:
      - "5432:5432"
    volumes:
      # Permanently persist PostgreSQL data directly into ./data/postgres on your machine
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultops_admin} -d ${POSTGRES_DB:-vaultops_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vaultops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-dev_placeholder_only_replace_in_prod_minimum_32_bytes_long_string_abc123}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - VAULT_LOCK_TIMEOUT_MINUTES=${VAULT_LOCK_TIMEOUT_MINUTES:-15}
      - POSTGRES_USER=${POSTGRES_USER:-vaultops_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_db_secure_password_replace_me}
      - POSTGRES_DB=${POSTGRES_DB:-vaultops_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vaultops_admin}:${POSTGRES_PASSWORD:-dev_db_secure_password_replace_me}@postgres:5432/${POSTGRES_DB:-vaultops_db}
      - LOCAL_MASTER_KEK=${LOCAL_MASTER_KEK:-eDRkd2V5c2ZkZ3NkaGZnaHdhZXJ0eXVpb3A4NzY1NDM=}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}
      - AWS_KMS_KEY_ID=${AWS_KMS_KEY_ID:-}
      - LOCAL_STORAGE_DIR=${LOCAL_STORAGE_DIR:-/app/storage}
    volumes:
      - ./backend:/app
      - ./data/storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vaultops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

